<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Vortex — Поддержка</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; font-family: 'Montserrat', sans-serif; }
        html { scroll-behavior: smooth; }
        
        body { background: #080808; color: #fff; overflow: hidden; height: 100vh; }

        .viewport-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; overflow: hidden; }
        .bg-image { position: absolute; top: -5%; left: -5%; width: 110%; height: 110%; background: url('bg.jpg') no-repeat center center/cover; will-change: transform; }
        .bg-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 30%, rgba(10, 10, 10, 0.4) 0%, #080808 90%); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); }

        /* --- ШАПКА --- */
        @keyframes slideDown { from { transform: translateY(-100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .header-wrapper { position: fixed; top: 25px; left: 0; width: 100%; display: flex; justify-content: center; z-index: 1000; animation: slideDown 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        header { 
            background: rgba(20, 20, 20, 0.6); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); 
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 100px; 
            display: flex; align-items: center; padding: 6px 12px 6px 20px; gap: 25px; box-shadow: 0 15px 40px rgba(0,0,0,0.5);
        }

        .logo-link { display: flex; align-items: center; gap: 12px; text-decoration: none; transition: 0.3s; }
        .logo-img { height: 20px; width: auto; filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.6)); }
        .logo-text { font-weight: 900; font-size: 13px; text-transform: uppercase; color: #fff; letter-spacing: 2.5px; }

        nav { display: flex; gap: 5px; }
        .nav-link { color: #666; text-decoration: none; font-size: 11px; font-weight: 800; text-transform: uppercase; padding: 10px 18px; border-radius: 100px; transition: .3s; letter-spacing: 1px; }
        .nav-link:hover, .nav-link.active { color: #fff; background: rgba(255,255,255,0.05); }

        .btn-auth { background: #fff; color: #000; padding: 11px 24px; border-radius: 100px; font-size: 11px; font-weight: 900; text-decoration: none; text-transform: uppercase; transition: .3s; }
        .btn-auth:hover { transform: scale(0.96); opacity: 0.9; }

        /* --- КОНТЕНТ --- */
        @keyframes contentRise { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .main-content { height: 100%; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .support-card { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); padding: 70px 60px; border-radius: 50px; max-width: 650px; width: 100%; text-align: center; animation: contentRise 1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .support-tag { font-size: 10px; color: #3b82f6; font-weight: 900; text-transform: uppercase; margin-bottom: 20px; letter-spacing: 4px; display: block; }
        h1 { font-size: 46px; font-weight: 900; margin-bottom: 20px; letter-spacing: -2px; text-transform: uppercase; }
        p { color: #888; font-size: 15px; margin-bottom: 50px; line-height: 1.7; font-weight: 500; }
        .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .method-btn { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05); padding: 35px 20px; border-radius: 35px; color: #fff; text-decoration: none; transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .method-btn:hover { background: rgba(59, 130, 246, 0.05); border-color: rgba(59, 130, 246, 0.3); transform: translateY(-10px); box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .method-btn svg { width: 32px; height: 32px; color: #3b82f6; transition: 0.3s; }
        .method-btn span { font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
        .method-btn small { color: #555; font-size: 10px; font-weight: 700; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="viewport-bg">
        <div class="bg-image" id="parallaxBg"></div>
        <div class="bg-overlay"></div>
    </div>

    <div class="header-wrapper">
        <header>
            <a href="index.html" class="logo-link">
                <img src="logo.svg" alt="Vortex" class="logo-img">
                <span class="logo-text">VORTEX</span>
            </a>
            <nav>
                <a href="index.html" class="nav-link">Главная</a>
                <a href="services.html" class="nav-link">Купить</a>
                <a href="support.html" class="nav-link active">Помощь</a>
            </nav>
            <a href="login.html" class="btn-auth">Аккаунт</a>
        </header>
    </div>

    <div class="main-content">
        <div class="support-card">
            <span class="support-tag">Технический центр</span>
            <h1>Нужна помощь?</h1>
            <p>Наши специалисты помогут с настройкой софта, активацией подписки или решением технических ошибок.</p>
            <div class="contact-grid">
                <a href="https://t.me/vortex_support" class="method-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    <span>Telegram</span>
                    <small>Ответ: 5-15 минут</small>
                </a>
                <a href="https://discord.gg/vortex" class="method-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    <span>Discord</span>
                    <small>Тикеты 24/7</small>
                </a>
            </div>
        </div>
    </div>

    <script>
        const parallaxBg = document.getElementById('parallaxBg');
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.clientX) / 60; 
            const y = (window.innerHeight / 2 - e.clientY) / 60;
            parallaxBg.style.transform = `translate3d(${x}px, ${y}px, 0) scale(1.05)`;
        });
    </script>
</body>
</html>
